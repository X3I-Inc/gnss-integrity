[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-integrity"
version = "0.0.1"
description = "GNSS/GPS integrity toolkit: GPS+IMU EKF fusion with an anomaly/spoofing detector layered on top."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pynmea2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
hardware = [
    "pyserial",  # scripts/nmea_logger.py: live NMEA capture over serial
]

[tool.setuptools.packages.find]
where = ["src"]
